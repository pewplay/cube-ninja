<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a3a4a">
  <title>Cube Ninja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Game canvas -->
  <canvas id="c" aria-label="Cube Ninja game area"></canvas>

  <!-- Gameplay HUD -->
  <div class="hud">
    <div class="hud__score">
      <div class="score-lbl"></div>
      <div class="cube-count-lbl"></div>
    </div>
    <button type="button" class="pause-btn" aria-label="Pause">
      <span></span>
    </button>
    <div class="slowmo">
      <div class="slowmo__bar"></div>
    </div>
  </div>

  <!-- Menu System -->
  <div class="menus">
    <div class="menu menu--main">
      <h1>Cube Ninja!</h1>
      <p class="menu-hint">Swipe through the cubes to smash them. Don&rsquo;t let a single one fall!</p>
      <button type="button" class="play-normal-btn">PLAY GAME</button>
      <button type="button" class="play-casual-btn">CASUAL MODE</button>
      <div class="main-high-score-lbl"></div>
    </div>
    <div class="menu menu--pause">
      <h1>Paused</h1>
      <button type="button" class="resume-btn">RESUME GAME</button>
      <button type="button" class="menu-btn--pause">MAIN MENU</button>
    </div>
    <div class="menu menu--score">
      <h1>Game Over</h1>
      <h2>Your Score:</h2>
      <div class="final-score-lbl"></div>
      <div class="high-score-lbl"></div>
      <button type="button" class="play-again-btn">PLAY AGAIN</button>
      <button type="button" class="menu-btn--score">MAIN MENU</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
